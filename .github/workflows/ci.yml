name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: confirma
          POSTGRES_PASSWORD: confirma
          POSTGRES_DB: confirma_ai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U confirma" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://confirma:confirma@localhost:5432/confirma_ai_test
      TEST_DATABASE_URL: postgresql+psycopg://confirma:confirma@localhost:5432/confirma_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrations aplicam sem erro e batem com os modelos
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Testes (pytest no PostgreSQL, inclusive concorrência)
        run: pytest
